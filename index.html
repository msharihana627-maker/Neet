<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOIR NEET</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0B0B0B;--c1:#151515;--c2:#1C1C1C;--bd:#2A2A2A;--tx:#F5F5F5;--mu:#999;--ac:#A3B18A;--wn:#C9A27E;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:13px;letter-spacing:.18em;color:var(--mu);margin:0 0 14px;font-weight:600}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;font-weight:600}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:52px;font-weight:600;line-height:1}
.mu{color:var(--mu);font-size:13px}.ac{color:var(--ac)}.wn{color:var(--wn)}
.bar{height:5px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:40px}
button{cursor:pointer}button:active{opacity:.7}
button.pri{background:var(--ac);color:#0B0B0B;border-color:var(--ac);font-weight:600}
button.gh{background:none;border-color:transparent;color:var(--mu);padding:6px 8px;min-height:32px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ac);padding:0}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
dialog label+*{width:100%}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .nm{flex:1;min-width:0}
.done .t{text-decoration:line-through;color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button.on{border-color:var(--ac);color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);padding:14px 4px;min-height:52px;font-size:13px}
nav button.on{color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mu)}
.day{position:relative;aspect-ratio:1;padding:0;border-radius:10px;background:var(--c2)}
.day.today{border-color:var(--tx)}.day.sel{background:var(--ac);color:#0B0B0B;border-color:var(--ac)}
.dot{position:absolute;bottom:5px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:9px;background:var(--tx)}
.dot.ok{background:var(--ac)}.dot.od{background:var(--wn)}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px}
.chart div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
dialog{background:var(--c1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;width:min(92vw,420px);padding:18px}
dialog::backdrop{background:#000a}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--c2);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;display:none;z-index:9}
#mmc{touch-action:none;height:66vh;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--c1)}#mmc svg{display:block;user-select:none}
body.fz nav{display:none}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.cell{aspect-ratio:1;padding:0;font-size:11px;border-radius:8px;position:relative}
.cell.ok{background:var(--ac);color:#0B0B0B;border-color:var(--ac)}
.cell.ip{border-color:var(--ac);color:var(--ac)}
.cell.rs{opacity:.45;border-style:dashed}
.cell.od{border-color:var(--wn)}
.cell.today{outline:2px solid var(--tx)}
.cell.mk::after{content:'';position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:9px;background:var(--wn)}
textarea{width:100%;resize:vertical}
@media(min-width:900px){nav{top:0;right:auto;width:150px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:24px}nav button{flex:0;text-align:left;padding:12px 20px}main{margin-left:170px;max-width:820px}}
</style></head><body>
<main id="main"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const K='noirneet.v1',ST=['Not Started','Learning','Practiced','Revision Pending','Completed'],
TY=['Lecture','NCERT','MCQs','Revision','Chapter target','Mock test','Study session','Break'],SB=['Physics','Chemistry','Biology','General'],
GR={'Physics':'Units & Measurement|Motion in a Straight Line|Motion in a Plane|Laws of Motion|Work, Energy & Power|Rotational Motion|Gravitation|Mechanical Properties of Solids|Mechanical Properties of Fluids|Thermal Properties of Matter|Thermodynamics|Kinetic Theory|Oscillations|Waves|Electric Charges & Fields|Electrostatic Potential & Capacitance|Current Electricity|Moving Charges & Magnetism|Magnetism & Matter|Electromagnetic Induction|Alternating Current|Electromagnetic Waves|Ray Optics|Wave Optics|Dual Nature of Matter|Atoms|Nuclei|Semiconductor Electronics',
'Physical Chemistry':'Some Basic Concepts|Structure of Atom|Thermodynamics|Equilibrium|Redox Reactions|Solutions|Electrochemistry|Chemical Kinetics',
'Organic Chemistry':'Basic Principles of Organic Chemistry|Hydrocarbons|Haloalkanes & Haloarenes|Alcohols, Phenols & Ethers|Aldehydes, Ketones & Carboxylic Acids|Amines|Biomolecules',
'Inorganic Chemistry':'Classification of Elements|Chemical Bonding|p-Block Elements|d- and f-Block Elements|Coordination Compounds',
'Botany':'The Living World|Biological Classification|Plant Kingdom|Morphology of Flowering Plants|Anatomy of Flowering Plants|Cell: The Unit of Life|Cell Cycle & Division|Photosynthesis|Respiration in Plants|Plant Growth & Development|Sexual Reproduction in Flowering Plants|Principles of Inheritance|Molecular Basis of Inheritance|Organisms & Populations|Ecosystem|Biodiversity & Conservation|Biotechnology: Principles|Biotechnology: Applications',
'Zoology':'Animal Kingdom|Structural Organisation in Animals|Biomolecules|Breathing & Exchange of Gases|Body Fluids & Circulation|Excretory Products|Locomotion & Movement|Neural Control & Coordination|Chemical Coordination|Human Reproduction|Reproductive Health|Evolution|Human Health & Disease|Microbes in Human Welfare'};
const subOf=g=>g==='Physics'?'Physics':/Chem/.test(g)?'Chemistry':'Biology';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const p2=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const T=()=>ds(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const hrs=m=>(m/60).toFixed(1)+'h';
function seed(){const a=[];for(const g in GR)GR[g].split('|').forEach(n=>a.push({id:uid(),g,sub:subOf(g),n,st:0}));return a}
function D(){return{exam:'',target:4,ch:seed(),tasks:[],logs:[],start:'',days:{},rest:[],wd:['cd','td','jr','sy','mo','st','nt'],mot:{on:1,mine:[],fav:'',goal:'',why:[],cat:''},notes:'',mocks:[],nb:[],maps:[],tg:{ch:0,q:0,rv:0},rvl:[],iv:[1,3,7,14,30],pm:{w:25,b:5,l:15},tm:null}}
function load(){try{const j=JSON.parse(localStorage.getItem(K));if(j&&j.ch)return Object.assign(D(),j)}catch(e){}return D()}
let S=load(),tab='home',fs='',fst='',q='',cm=new Date(),sel=T();cm.setDate(1);
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save: storage unavailable')}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2500)}
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
function cnt(sub){const a=S.ch.filter(c=>!sub||c.sub===sub);const d=a.filter(c=>c.st===4).length;return[d,a.length,a.length?Math.round(d/a.length*100):0]}
const mins=(f)=>S.logs.filter(f).reduce((a,l)=>a+l.min,0);
const byT=(a,b)=>(a.date+(a.st||'99')).localeCompare(b.date+(b.st||'99'));

function taskRow(t,od){return`<div class="row ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tog('${t.id}')" aria-label="Done">
<div class="nm"><div class="t">${esc(t.t)}</div><div class="mu">${t.type} · ${t.sub}${t.st?' · '+t.st+(t.en?'–'+t.en:''):''}${od?' · '+t.date:''}</div></div>
${t.done?'':`<button class="gh" onclick="mv('${t.id}')" title="Move">${od?'Today':'Tomorrow'}</button>`}<button class="gh" onclick="taskDlg('${t.id}')">Edit</button></div>`}

function home0(){
 let cd;
 if(!S.exam)cd=`<div class="big">—</div><p class="mu">Set your exam date to start the countdown.</p>`;
 else{const n=Math.round((new Date(S.exam+'T00:00')-new Date(T()+'T00:00'))/864e5);
  cd=n<0?`<div class="big">Done</div><p class="mu">Your exam date has passed. Update it if needed.</p>`:`<div class="big">${n}</div><p class="mu">day${n==1?'':'s'} until NEET · ${S.exam.slice(0,4)}</p>`}
 const[d,t,p]=cnt(),tk=S.tasks.filter(x=>x.date===T()).sort(byT),od=S.tasks.filter(x=>!x.done&&x.date<T()).sort(byT);
 const m=mins(l=>l.date===T()),tp=Math.min(100,Math.round(m/(S.target*60)*100)||0),dn=tk.filter(x=>x.done).length;
 return`<h1>NOIR NEET</h1>
<div class="card"><h2>Countdown</h2>${cd}<label>Exam date</label><input type="date" value="${S.exam}" onchange="setExam(this.value)"></div>
<div class="card"><div class="sp"><h2>Syllabus</h2><span class="mu">${d}/${t} chapters</span></div><div class="big ac" style="font-size:36px">${p}%</div>${bar(p)}
${['Physics','Chemistry','Biology'].map(s=>{const[a,b,c]=cnt(s);return`<div class="sp mu"><span>${s}</span><span>${a}/${b} · ${c}%</span></div>${bar(c)}`}).join('')}</div>
<div class="card"><h2>Today</h2><div class="sp"><span>${hrs(m)} of <input type="number" min="0.5" max="16" step="0.5" value="${S.target}" style="width:70px;min-height:32px;padding:4px 8px" onchange="setTarget(this.value)"> h</span><span class="mu">${tp}%</span></div>${bar(tp)}
<div class="mu" style="margin-bottom:8px">${dn} done · ${tk.length-dn} remaining</div>
${tk.length?tk.map(x=>taskRow(x)).join(''):'<p class="mu">Nothing scheduled today.</p>'}
<div style="display:flex;gap:8px;margin-top:10px"><button class="pri" onclick="taskDlg('',T())">Add task</button><button onclick="logDlg()">Log study time</button></div></div>
${od.length?`<div class="card"><h2 class="wn">Overdue · ${od.length}</h2>${od.map(x=>taskRow(x,1)).join('')}</div>`:''}`}

function sylList(){let o='';for(const g in GR){const all=S.ch.filter(c=>c.g===g),a=all.filter(c=>(!fs||c.sub===fs)&&(fst===''||c.st==fst)&&c.n.toLowerCase().includes(q.toLowerCase()));if(!a.length)continue;
 o+=`<div class="card"><div class="sp"><h2>${g}</h2><span class="mu">${all.filter(c=>c.st==4).length}/${all.length}</span></div>${a.map(c=>`<div class="row"><div class="nm ${c.st==4?'ac':''}" onclick="chDlg('${c.id}')">${esc(c.n)}</div><select onchange="setSt('${c.id}',this.value)" style="max-width:150px">${ST.map((s,i)=>`<option value="${i}" ${i==c.st?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div>`}
 return o||'<p class="mu">No chapters match.</p>'}
function syl(){const[d,t,p]=cnt();return`<h1>SYLLABUS</h1><div class="card"><div class="sp"><span class="ac" style="font-size:28px">${p}%</span><span class="mu">${d}/${t} completed</span></div>${bar(p)}
<div class="chips">${['','Physics','Chemistry','Biology'].map(s=>`<button class="${fs===s?'on':''}" onclick="fs='${s}';render()">${s||'All'}</button>`).join('')}</div>
<div class="sp"><input id="q" placeholder="Search chapters" value="${esc(q)}" oninput="q=this.value;$('#sl').innerHTML=sylList()" style="flex:1"><select onchange="fst=this.value;render()"><option value="">Any status</option>${ST.map((s,i)=>`<option value="${i}" ${fst!==''&&fst==i?'selected':''}>${s}</option>`).join('')}</select></div>
<button style="margin-top:10px" onclick="chDlg()">+ Add chapter</button></div><div id="sl">${sylList()}</div>`}

function cal0(){const y=cm.getFullYear(),m=cm.getMonth(),f=cm.getDay(),n=new Date(y,m+1,0).getDate();let c=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<b></b>'.repeat(f);
 for(let d=1;d<=n;d++){const k=y+'-'+p2(m+1)+'-'+p2(d),a=S.tasks.filter(t=>t.date===k),cl=a.length?(a.every(t=>t.done)?'ok':(k<T()?'od':'')):null;
  c+=`<button class="day ${k===T()?'today':''} ${k===sel?'sel':''}" onclick="sel='${k}';render()">${d}${cl!==null?`<i class="dot ${cl}"></i>`:''}</button>`}
 const a=S.tasks.filter(t=>t.date===sel).sort(byT);
 return`<h1>CALENDAR</h1><div class="card"><div class="sp" style="margin-bottom:10px"><button onclick="nm(-1)">‹</button><b>${cm.toLocaleDateString('en',{month:'long',year:'numeric'})}</b><button onclick="nm(1)">›</button></div><div class="cal">${c}</div></div>
<div class="card"><div class="sp"><h2>${new Date(sel+'T00:00').toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'})}</h2><button class="pri" onclick="taskDlg('',sel)">Add</button></div>${a.length?a.map(x=>taskRow(x)).join(''):'<p class="mu">No tasks on this day.</p>'}</div>`}

function prog(){const[d,t,p]=cnt(),days=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push(ds(x))}
 const hv=days.map(k=>mins(l=>l.date===k)),mx=Math.max(...hv,1),done=S.tasks.filter(x=>x.done).length,wk=S.tasks.filter(x=>days.includes(x.date)),wd=wk.filter(x=>x.done).length;
 return`<h1>PROGRESS</h1><div class="card"><h2>Overall preparation</h2><div class="sp"><span class="big ac" style="font-size:40px">${p}%</span><span class="mu">${d}/${t} chapters</span></div>${bar(p)}
${['Physics','Chemistry','Biology'].map(s=>{const[a,b,c]=cnt(s);return`<div class="sp mu"><span>${s}</span><span>${a}/${b}</span></div>${bar(c)}`}).join('')}
<h2 style="margin-top:6px">By status</h2>${ST.map((s,i)=>`<div class="sp mu"><span>${s}</span><span>${S.ch.filter(c=>c.st===i).length}</span></div>`).join('')}</div>
<div class="card"><h2>Study hours · last 7 days</h2><div class="chart">${hv.map((v,i)=>`<div><span>${v?hrs(v):''}</span><i style="height:${v/mx*70}%"></i>${days[i].slice(8)}</div>`).join('')}</div>
<p class="mu">Total: ${hrs(hv.reduce((a,b)=>a+b,0))}${S.logs.length?'':' · No study time logged yet. Use “Log study time” on Home.'}</p></div>
<div class="card"><h2>Hours by subject (all time)</h2>${SB.map(s=>`<div class="sp mu"><span>${s}</span><span>${hrs(mins(l=>l.sub===s))}</span></div>`).join('')}</div>
<div class="card"><h2>Tasks</h2><div class="sp mu"><span>Completed (all time)</span><span>${done}</span></div><div class="sp mu"><span>This week</span><span>${wd}/${wk.length}</span></div></div>
${progX()}<div class="card"><h2>Data</h2><button onclick="if(confirm('Erase ALL your data on this device?')){localStorage.removeItem(K);S=load();render()}">Reset all data</button></div>`}

function render(){const y=scrollY;document.body.classList.toggle('fz',tab==='foc'&&!!S.tm);$('#main').innerHTML={home,syl,cal,plan,prog,foc,more,rev,tests,notes,mm}[tab]();
 $('#nav').innerHTML=[['home','Home'],['syl','Syllabus'],['cal','Calendar'],['foc','Focus'],['prog','Progress'],['more','More']].map(([k,l])=>`<button class="${tab===k||(k==='more'&&MORE.includes(tab))?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${l}</button>`).join('');scrollTo(0,y)}
function setExam(v){S.exam=v;save();render()}
function setTarget(v){v=parseFloat(v);if(!(v>=0.5&&v<=16)){toast('Enter 0.5 to 16 hours');return render()}S.target=v;save();render()}
function setSt(id,v){const c=S.ch.find(c=>c.id===id);v=+v;if(v===4&&c.st!==4){c.dn=T();c.rv=0;c.nx=addD(T(),S.iv[0])}else if(v!==4&&c.st===4){c.nx='';c.rv=0}c.st=v;save();render()}
function tog(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
function mv(id){const t=S.tasks.find(x=>x.id===id),d=new Date(T()+'T00:00');if(t.date>=T())d.setDate(d.getDate()+1);t.date=ds(d);save();render();toast('Moved to '+t.date)}
function nm(n){cm.setMonth(cm.getMonth()+n);render()}
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
function taskDlg(id,date){const t=id?S.tasks.find(x=>x.id===id):{t:'',type:'Study session',sub:'General',date,st:'',en:''};
 dlg.innerHTML=`<form onsubmit="saveTask(event,'${id}')"><h2>${id?'Edit':'New'} task</h2><label>Title</label><input name="t" maxlength="80" value="${esc(t.t)}" required>
<label>Type</label><select name="type">${opts(TY,t.type)}</select><label>Subject</label><select name="sub">${opts(SB,t.sub)}</select><label>Date</label><input type="date" name="date" value="${t.date}" required>
<div class="grid"><div><label>Start</label><input type="time" name="st" value="${t.st||''}"></div><div><label>End</label><input type="time" name="en" value="${t.en||''}"></div></div>
${id?'':`<label>Repeat</label><select name="rp"><option value="">Does not repeat</option><option value="d">Every day</option><option value="wd">Weekdays</option><option value="wk">Every week</option></select><label>Repeat until</label><input type="date" name="un">`}<div class="sp" style="margin-top:16px"><span>${id?`<button type="button" class="gh wn" onclick="delTask('${id}')">Delete</button>${t.rs?`<button type="button" class="gh wn" onclick="delSer('${id}')">Delete series</button>`:''}`:''}</span><span><button type="button" onclick="dlg.close()">Cancel</button> <button class="pri" id="sb">Save</button></span></div></form>`;dlg.showModal()}
function saveTask(e,id){e.preventDefault();const f=e.target,o={t:f.t.value.trim(),type:f.type.value,sub:f.sub.value,date:f.date.value,st:f.st.value,en:f.en.value};
 if(!o.t||!o.date)return toast('Title and date are required');if(o.st&&o.en&&o.en<=o.st)return toast('End time must be after start');
 const rp=id?'':f.rp.value,un=id?'':f.un.value;if(rp&&(!un||un<o.date||diff(o.date,un)>366))return toast('Pick a repeat end date within a year');$('#sb').disabled=true;if(id)Object.assign(S.tasks.find(x=>x.id===id),o);else if(rp){const rs=uid();for(let k=o.date,n=0;k<=un&&n<400;k=addD(k,rp==='wk'?7:1)){const w=new Date(k+'T00:00').getDay();if(rp==='wd'&&(w==0||w==6))continue;S.tasks.push({id:uid(),done:false,rs,...o,date:k});n++}}else S.tasks.push({id:uid(),done:false,...o});save();sel=o.date;dlg.close();render()}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();dlg.close();render()}
function chDlg(id){const c=id?S.ch.find(x=>x.id===id):{n:'',g:'Physics'};
 dlg.innerHTML=`<form onsubmit="saveCh(event,'${id||''}')"><h2>${id?'Edit':'Add'} chapter</h2><label>Name</label><input name="n" maxlength="80" value="${esc(c.n)}" required>${id?`<div class="grid"><div><label>Questions practiced</label><input type="number" name="qa" min="0" max="100000" value="${c.qa|0}"></div><div><label>Answered correctly</label><input type="number" name="qc" min="0" max="100000" value="${c.qc|0}"></div></div><label>Notes</label><textarea name="nt" rows="2" maxlength="500">${esc(c.nt||'')}</textarea>`:`<label>Section</label><select name="g">${opts(Object.keys(GR),'Physics')}</select>`}
<div class="sp" style="margin-top:16px"><span>${id?`<button type="button" class="gh wn" onclick="delCh('${id}')">Delete</button>`:''}</span><span><button type="button" onclick="dlg.close()">Cancel</button> <button class="pri" id="sb">Save</button></span></div></form>`;dlg.showModal()}
function saveCh(e,id){e.preventDefault();const n=e.target.n.value.trim();if(!n)return toast('Name required');$('#sb').disabled=true;

<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"><button type="button" onclick="mmAdd('${id}')">+ Child</button>${r?'':`<button type="button" onclick="mmMv('${id}',-1)">▲</button><button type="button" onclick="mmMv('${id}',1)">▼</button><button type="button" class="wn" onclick="mmRm('${id}')">Delete</button>`}</div><div class="sp" style="margin-top:14px"><button type="button" onclick="dlg.close()">Cancel</button><button class="pri">Save</button></div></form>`;dlg.showModal()}

document.addEventListener('pointerdown',e=>{if(!e.target.closest('#mmc'))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=0});

document.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===1){V.x+=dx;V.y+=dy;if(Math.abs(dx)+Math.abs(dy)>2)moved=1;mmT()}else if(ptr.size===2){const d=pdist();if(pd)zoom(d/pd);pd=d;moved=1}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{ptr.delete(e.pointerId);pd=0}));

 fc={q:a.sort(()=>Math.random()-.5),show:0,ok:0,tot:a.length,mk:!!mk.length};fcDraw()}

let mmLab=[],pdfjs=null;
function ldPdf(){return pdfjs||(pdfjs=new Promise((ok,no)=>{if(window.pdfjsLib)return ok(pdfjsLib);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(pdfjsLib)};s.onerror=()=>{pdfjs=null;no(new Error('Could not load the PDF reader'))};document.head.appendChild(s)}))}
async function mmPdf(i){const f=i.files[0];i.value='';if(!f)return;const a=+$('#pf').value,b=+$('#pt').value;if(f.size>2e7||!(a>=1&&b>=a&&b-a<6)||mmFiles.length+(b-a+1)>10)return toast('Use a PDF under 20 MB, at most 6 pages at a time (for example 3 to 8), and 10 pages in total');
 mmBusy='Reading PDF…';mmErr='';render();try{const L=await ldPdf(),d=await L.getDocument({data:await f.arrayBuffer()}).promise;if(b>d.numPages)throw new Error('The PDF has only '+d.numPages+' pages');
  for(let p=a;p<=b;p++){const pg=await d.getPage(p),v=pg.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;mmFiles.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)));mmLab.push('Page '+p)}}
 catch(e){mmErr=(e&&e.message)||'Could not read that PDF. Try photos of the pages instead.'}mmBusy='';render()}
